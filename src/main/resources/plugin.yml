name: UltimateMeteorAnticheat
version: 1.0.0-SNAPSHOT
main: net.meteorsmp.anticheat.UltimateMeoterAnticheat
api-version: '1.21'
commands:
  meteor:
    description: Main administrative command for UltimateMeteorAntiCheat
    aliases: [meteorac, mac]
    permission: meteorac.admin
    usage: /meteor <subcommand>
permissions:
  meteorac.admin:
    description: Full access to all anticheat commands and management
    default: op
  meteorac.alerts:
    description: Access to receive live detection alerts
    default: op
  meteorac.bypass.combat:
    description: Bypass combat check enforcement
    default: false
  meteorac.bypass.movement:
    description: Bypass movement check enforcement
    default: false
  meteorac.bypass.antidupe:
    description: Bypass anti-dupe engine checks
    default: false
