# ==============================================================================
#                  METEORAC - ADVANCED ANTICHEAT & ANTIDUPE ENGINE
# ==============================================================================
# Configuration Version: 4.8.2-RELEASE
# Directives: Extreme Security & Anti-Exploit Enforcement Protocol
# ==============================================================================

prefix: "&8[&cMeteorAC&8] "

# Core System Enforcement Mode
# Options: STRICT, QUARANTINE, SILENT_MONITOR, AGGRESSIVE_PURGE
mode: QUARANTINE

# Violation Buffer & Decay Dynamics
buffer:
  decay-rate: 0.5
  max-violations: 15.0
  decay-interval-seconds: 3
  violation-weight-multiplier: 1.25

# Global Item Protection Directives
protect-all-items: true
nbt-sanitization:
  enabled: true
  strip-illegal-enchantments: true
  strip-invalid-attributes: true
  strip-oversized-nbt-bytes: 2097152 # 2MB Max Payload
  strip-invalid-custom-data: true

# Cryptographic Identity & Tracking Protocols
signed-identities:
  accept-and-migrate-legacy: true
  key-file: identity.key
  shared-secret: ''
  enforce-unique-uuids: true
  crypto-hash-algorithm: SHA-256
  key-rotation-period-days: 30

# Two-Stage Enforcement Verification
two-stage-enforcement:
  enabled: true
  required-matches: 1
  confirmation-delay-ticks: 0
  candidate-expiry-seconds: 15
  auto-quarantine-on-mismatch: true

# Global Persistent Anti-Dupe Ledger
persistent-global-ledger:
  enabled: true
  startup-baseline-delay-ticks: 20
  learning-period-minutes: 1440
  required-matching-scans: 2
  auto-vacuum-interval-hours: 24
  sqlite-journal-mode: WAL

verification-delay-ticks: 1
periodic-player-audit-seconds: 15

# System Performance & Hardware Resource Throttling
performance:
  lag-control:
    enabled: true
    minimum-tps: 18.0
    pause-scans-below-tps: 16.0
    retry-delay-ticks: 20
  periodic-player-audits:
    players-per-tick: 8
    maximum-milliseconds-per-tick: 3.5
  background-scans:
    maximum-chunks-per-tick: 8
    maximum-inventories-per-tick: 64
    maximum-milliseconds-per-tick: 5.0
    minimum-spacing-seconds: 5
  async-thread-pool:
    core-pool-size: 4
    maximum-pool-size: 8
    keep-alive-seconds: 60

# ==============================================================================
#                      TRANSACTION & WORKSTATION HANDLERS
# ==============================================================================
transaction-handlers:
  crafting:
    enabled: true
    delay-ticks: 1
    cancel-on-fast-click: true
    max-crafts-per-second: 12
  bundles:
    enabled: true
    delay-ticks: 1
    include-contained-items-in-accounting: true
    recursive-content-check: true
    max-nesting-depth: 3
  anvil:
    enabled: true
    delay-ticks: 1
    validate-exp-cost: true
    prevent-renaming-dupe-vectors: true
  grindstone:
    enabled: true
    delay-ticks: 1
    audit-exp-disbursements: true
  smithing:
    enabled: true
    delay-ticks: 1
    validate-template-consumption: true
  stonecutter:
    enabled: true
    delay-ticks: 1
  cartography:
    enabled: true
    delay-ticks: 1
    lock-map-copying-bursts: true
  loom:
    enabled: true
    delay-ticks: 1
  villager-trades:
    enabled: true
    delay-ticks: 1
    verify-stock-decrement: true
    anti-curing-discount-exploit: true
  furnace:
    enabled: true
    delay-ticks: 1
  blast-furnace:
    enabled: true
    delay-ticks: 1
  smoker:
    enabled: true
    delay-ticks: 1
  brewing:
    enabled: true
    delay-ticks: 1
  crafter:
    enabled: true
    delay-ticks: 1
    redstone-clock-protection: true
  workstation-results:
    enabled: true
    delay-ticks: 1
  hopper-transfer:
    enabled: true
    audit-frequency-ticks: 2
    max-items-per-second: 8
  dropper-dispenser:
    enabled: true
    validate-shoot-events: true
  chiseled-bookshelf:
    enabled: true
    delay-ticks: 1

# ==============================================================================
#                       PLUGIN COMPATIBILITY HOOKS
# ==============================================================================
compatibility:
  external-plugin-inventories:
    enabled: true
    grace-delay-ticks: 2
    trusted-plugins:
      - UltimateShop
      - EconomyShopGUI
      - CrazyCrates
      - SmartSpawners
      - Skript
      - Vault
      - QuickShop
      - ChestShop
      - AuctionHouse
      - ShopGUIPlus
      - PlayerVaults
  ignore-cancelled-events: true
  override-custom-item-flags: true

# Items requiring strict UUID / NBT tracking across all worlds
tracked-stackables:
  - ENCHANTED_GOLDEN_APPLE
  - NETHERITE_BLOCK
  - NETHERITE_INGOT
  - DIAMOND_BLOCK
  - BEACON
  - DRAGON_EGG
  - ELYTRA
  - SHULKER_BOX
  - WHITE_SHULKER_BOX
  - ORANGE_SHULKER_BOX
  - MAGENTA_SHULKER_BOX
  - LIGHT_BLUE_SHULKER_BOX
  - YELLOW_SHULKER_BOX
  - LIME_SHULKER_BOX
  - PINK_SHULKER_BOX
  - GRAY_SHULKER_BOX
  - LIGHT_GRAY_SHULKER_BOX
  - CYAN_SHULKER_BOX
  - PURPLE_SHULKER_BOX
  - BLUE_SHULKER_BOX
  - BROWN_SHULKER_BOX
  - GREEN_SHULKER_BOX
  - RED_SHULKER_BOX
  - BLACK_SHULKER_BOX

tracked-unique-materials:
  - DRAGON_EGG
  - TRIAL_KEY
  - OMNI_DIRECTIONAL_VAULT_KEY
  - HEAVY_CORE

log-clean-transactions: false

# Background container & inventory audit scanning
cross-inventory-scanning:
  enabled: true
  period-seconds: 30
  scan-loaded-containers: true
  scan-offline-player-inventories: true
  scan-ender-chests: true
  scan-donkey-inventories: true
  scan-dropped-item-entities: true

# Administrative Warnings & Notifications
warnings:
  console: true
  console-verbosity: low
  notify-admins: true
  notify-permission: antidupe.notify
  time-zone: system
  daily-log:
    enabled: true
    file-prefix: anti-dupe-
    auto-compress-old-logs: true
    retain-logs-days: 30

language:
  default: en_US
  use-client-locale: true

recovery:
  enabled: true
  backup-corrupted-data: true
  auto-restore-on-desync: true

investigation-context:
  enabled: true
  nearby-player-radius-blocks: 32.0
  maximum-nearby-players: 20
  include-game-mode: true
  include-ping: true
  include-tps: true

chunk-audit:
  enabled: true
  chunks-per-tick: 2
  maximum-blocks-per-tick: 4096
  maximum-milliseconds-per-tick: 2.0
  load-unloaded-chunks: false
  maximum-detailed-findings: 512
  flag-excessive-tile-entities: true
  max-tile-entities-per-chunk: 96

command-history:
  enabled: true
  commands-per-incident: 15
  maximum-tracked-players: 1000
  maximum-command-length: 256
  sensitive-command-labels:
    - login
    - log
    - l
    - register
    - reg
    - changepassword
    - changepass
    - changepw
    - password
    - passwd
    - pin
    - 2fa
    - twofactor
    - auth
    - authenticate
    - otp
    - token
    - verify
    - verification
    - withdraw
    - pay

discord:
  enabled: false
  webhook-url: ''
  username: 'MeteorAC Anti-Dupe'
  avatar-url: ''
  locale: en_US
  embed-color: '#FFB000'
  include-coordinates: true
  role-mention: ''
  ping-on-high-vl: true
  min-vl-to-discord: 10.0

scanner:
  enabled: true
  online-inventory-minutes: 2
  ender-chest-minutes: 5
  loaded-containers-minutes: 5
  uuid-crosscheck-minutes: 5
  ledger-audit-minutes: 15
  players-per-batch: 10
  automatic-chunk-scans: true
  chunk-scan-delay-ticks: 5
  chunk-scans-per-batch: 16
  maximum-pending-chunk-scans: 1024

# Cross-Inventory & Teleport Desync Protection
cross-inventory-protection:
  stabilization:
    enabled: true
    after-join-ticks: 20
    after-chunk-change-ticks: 5
    after-world-change-ticks: 15
    after-teleport-ticks: 10
    after-portal-ticks: 15
    high-speed:
      enabled: true
      blocks-per-second-threshold: 25.0
      stabilization-ticks: 5
  confirmation:
    enabled: true
    delay-ticks: 2
    required-matches: 2
    candidate-expiry-seconds: 5

metrics:
  first-run-notice: true
  bstats-enabled: true

database:
  type: sqlite
  schema-migrations: true
  fail-startup-on-error: true
  sqlite:
    file: anti-dupe.db
  remote:
    host: 127.0.0.1
    port: 3306
    database: antidupe
    username: antidupe
    password: change-me
    parameters: useSSL=false&serverTimezone=UTC&maximumPoolSize=10

inventory-rollbacks:
  enabled: true
  capture-before-inventory-events: true
  capture-on-confirmed-detection: true
  capture-before-network-transfer: true
  snapshot-cooldown-seconds: 1
  retention-days: 7
  maximum-snapshots-per-player: 100
  allow-cross-player-restore: false
  require-player-online-for-restore: true

network:
  enabled: false
  proxy: NONE
  server-id: survival-1
  plugin-message-channel: antidupe:network
  heartbeat-seconds: 30
  stale-server-seconds: 120
  transfer-lock-seconds: 20
  player-lease-seconds: 45
  join-verification-delay-ticks: 20
  capture-transfer-snapshot: true
  reject-join-while-locked: true
  inventory-mismatch-action: KICK
  shared-ledger: true
  cross-server-uuid-checks: true
  cross-server-stack-accounting: true

world-rules:
  enabled: true
  default-mode: inherit
  scan-ender-chests-by-default: true
  worlds:
    spawn:
      mode: inherit
      scan-ender-chest: true
    world:
      mode: quarantine
      scan-ender-chest: true
    world_nether:
      mode: quarantine
      scan-ender-chest: true
    world_the_end:
      mode: quarantine
      scan-ender-chest: true
    creative:
      mode: quarantine
      scan-ender-chest: true

world-bypasses:
  reach:
    - spawn
  fly:
    - spawn
  nofall:
    - spawn

# Specific Exploit Heuristics Fingerprinting
exploit-fingerprints:
  enabled: true
  record-matches: true
  include-in-console: true
  include-in-daily-log: true
  include-in-discord: true
  minimum-confidence-to-report: 15
  database-file: exploit-fingerprints.yml
  signals:
    window-seconds: 5
    rapid-rejoin-milliseconds: 3000
    rapid-chunk-transition-milliseconds: 200
    gui-click-burst-milliseconds: 450
    drop-burst-milliseconds: 500
    portal-container-open-ms: 150
    disconnect-while-entity-interact-ms: 300

security:
  enabled: true
  enforce-on-startup: true
  enforce-on-join: true
  enforce-on-world-change: true
  audit-period-seconds: 5
  delayed-join-rechecks-ticks:
    - 1
    - 10
    - 40
  notify-admins: true
  notify-permission: antidupe.notify
  op-protection:
    enabled: true
    allowed-uuids:
      - 'f9397b3e-f54d-4c4a-9910-071087dbbff1'
    block-player-op-commands: true
    recheck-after-server-commands: true
  creative-protection:
    enabled: true
    allowed-uuids:
      - 'f9397b3e-f54d-4c4a-9910-071087dbbff1'
    fallback-gamemode: SURVIVAL

advanced-transfer-protection:
  command-transfers:
    enabled: true
    grace-delay-ticks: 1
    include-ender-chests: true
    include-open-inventories: true
    capture-rollbacks-for-online-players: true
    monitor-all-plugin-commands: false
    monitored-labels:
      - gift
      - buy
      - vault
      - senditem
      - itemgift
      - trade
      - pay
      - ah
  explicitly-trusted-command-plugins:
    - Skript
  explicitly-trusted-command-labels:
    - sell
    - kit
    - givephysicalkey
  plugin-managed-storage:
    enabled: true
    title-patterns:
      - vault
      - private vault
      - storage
      - player vault
      - chest
      - backpack
    plugins: []
    verify-open-close-conservation: true
    crosscheck-on-open: true
    state-save-delay-ticks: 1
    closed-state-increase-action: quarantine
  repeated-small-transfers:
    enabled: true
    window-seconds: 10
    maximum-single-delta: 4
    event-threshold: 2
    quantity-threshold: 2
  identity-integrity:
    enabled: true
    force-unique-materials: []

# ==============================================================================
#                 COMPREHENSIVE ANTICHEAT CHECKS MATRIX
# ==============================================================================
checks:
  combat:
    killaura:
      enabled: true
      max-cps: 15
      check-angle: true
      check-reach: true
      check-heuristic-raycast: true
      check-multi-target: true
      check-lock-on: true
      max-violations: 10
    reach:
      enabled: true
      max-reach: 3.01
      dynamic-ping-compensation: true
      max-violations: 8
    autoclicker:
      enabled: true
      max-cps: 18
      consistency-check: true
      check-statistical-variance: true
      max-violations: 12
    velocity:
      enabled: true
      horizontal-modifier: 100.0
      vertical-modifier: 100.0
      strict-ground-check: true
      max-violations: 6
    hitbox:
      enabled: true
      expansion-tolerance: 0.05
    aimassist:
      enabled: true
      smoothing-detection: true
      pitch-yaw-ratio-check: true
    criticals:
      enabled: true
      fall-distance-check: true
      ground-packet-check: true
    fastbow:
      enabled: true
      min-draw-ticks: 3
    autototem:
      enabled: true
      min-swap-delay-ms: 60

  movement:
    fly:
      enabled: true
      max-vertical-speed: 0.42
      allow-glide-with-elytra: true
      glide-friction-multiplier: 0.99
      max-violations: 10
    speed:
      enabled: true
      max-ground-speed: 0.287
      max-air-speed: 0.36
      ice-speed-multiplier: 2.5
      soul-sand-multiplier: 1.0
      max-violations: 10
    noslow:
      enabled: true
      check-item-use: true
      check-bow-draw: true
      check-shield-block: true
      check-soul-speed: true
    nofall:
      enabled: true
      spoof-ground-check: true
      fall-distance-reset-check: true
    jesus:
      enabled: true
      allow-depth-strider: true
      allow-dolphin-grace: true
    spider:
      enabled: true
      max-climb-rate: 0.2
    step:
      enabled: true
      max-step-height: 0.6
    highjump:
      enabled: true
      max-jump-height: 1.25
    vclip:
      enabled: true
      max-vertical-teleport: 1.5
    hclip:
      enabled: true
      max-horizontal-teleport: 2.0
    phase:
      enabled: true
      check-block-intersection: true
      prevent-suffocation-bypass: true
    elytrafly:
      enabled: true
      max-boost-speed: 2.8
      check-packet-firework-burst: true
    inventorymove:
      enabled: true
      cancel-movement-in-gui: true
    timer:
      enabled: true
      max-packet-speed: 1.04
      sample-period-ticks: 40

  world:
    fastplace:
      enabled: true
      min-delay-ms: 50
    scaffold:
      enabled: true
      check-pitch-lock: true
      check-rotations: true
      check-sneak-edge: true
    fastbreak:
      enabled: true
      break-speed-tolerance: 1.02
      check-efficiency-enchant: true
      check-haste-effect: true
    autotool:
      enabled: true
      instant-swap-check: true
    blockreach:
      enabled: true
      max-block-reach: 4.5
    ghosthand:
      enabled: true
      check-raytrace-line-of-sight: true
    wallclick:
      enabled: true
      prevent-interact-through-walls: true
    nuker:
      enabled: true
      max-breaks-per-second: 6

  inventory:
    autoarmor:
      enabled: true
      min-equip-delay-ms: 100
    cheststealer:
      enabled: true
      min-click-delay-ms: 70
      check-cursor-teleport: true
    autoloot:
      enabled: true
      min-loot-delay-ms: 80
    fasteat:
      enabled: true
      min-consume-ticks: 28

  packet:
    badpackets:
      enabled: true
      check-invalid-pitch: true # Pitch outside [-90, 90]
      check-invalid-yaw: true
      check-slot-switch: true
      check-steer-vehicle: true
      check-held-item-slot: true
    packetspam:
      enabled: true
      max-packets-per-second: 300
    payloadfilter:
      enabled: true
      max-custom-payload-bytes: 32767
      block-unknown-channels: true

# ==============================================================================
#                DETAILED ANTI-DUPE CHECKS & DETECTION ENGINE
# ==============================================================================
antidupe-engine:
  item-fingerprinting:
    enabled: true
    generate-uuid-on-spawn: true
    track-nbt-hash: true
    detect-cloned-nbt-tags: true
    illegal-stack-size:
      action: CLEAR_AND_NOTIFY
      max-overstack-ratio: 1.0
    container-desync-protection:
      check-on-chunk-unload: true
      check-on-entity-death: true
      check-on-player-quit: true

  specific-dupe-mitigations:
    donkey-chest-dupe:
      enabled: true
      prevent-inventory-open-during-despawn: true
      prevent-mount-disconnect-dupe: true
    portal-dupe:
      enabled: true
      close-inventory-on-portal-enter: true
      cancel-drop-in-portal-transition: true
    crafting-table-desync:
      enabled: true
      clear-crafting-matrix-on-disconnect: true
    shulker-drop-dupe:
      enabled: true
      validate-break-owner: true
      delay-hopper-pickup-ticks: 2
    book-and-quill-dupe:
      enabled: true
      max-book-pages: 50
      max-bytes-per-page: 256
      strip-invalid-click-events: true
    anvil-rename-dupe:
      enabled: true
      clear-repair-cost-overflow: true
    end-portal-frame-dupe:
      enabled: true
      cancel-interact-on-dimension-change: true

# ==============================================================================
#                  PUNISHMENTS & AUTOMATED ACTION THRESHOLDS
# ==============================================================================
punishments:
  action: "QUARANTINE"
  kick-message: "&c[MeteorAC] Suspicious network activity / packet anomaly detected."
  ban-message: "&c[MeteorAC] You have been permanently banned for exploiting or cheating."
  quarantine-message: "&c[MeteorAC] Your inventory has been temporarily frozen for verification."
  
  violation-levels:
    10:
      action: "NOTIFY"
      command: ""
    20:
      action: "CANCEL_EVENT"
      command: "warn {player} &c[MeteorAC] Unusual movement/inventory activity detected."
    50:
      action: "QUARANTINE"
      command: "antidupe freeze {player}"
    100:
      action: "KICK"
      command: "kick {player} &c[MeteorAC] Security verification failure."
    200:
      action: "BAN"
      command: "ban {player} 7d &c[MeteorAC] Confirmed exploit/cheat pattern."

# Custom Bypasses per Permission Group
permissions:
  bypass-combat: "meteorac.bypass.combat"
  bypass-movement: "meteorac.bypass.movement"
  bypass-world: "meteorac.bypass.world"
  bypass-antidupe: "meteorac.bypass.antidupe"
  admin-commands: "meteorac.admin"
